[package]
name = "pond_vector_lens"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorLens — vector storage with ANN search (uses IVF/HNSW index extensions)"

[lib]
name = "pond_vector_lens"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
pond_kernel = { path = "../../../core/kernel" }
pond_storage = { path = "../../../core/storage" }
pond_core = { path = "../../../core/codec", features = ["zstd"] }
pond_ivf_index = { path = "../../../extensions/indexes/ivf/rust" }
pond_hnsw_index = { path = "../../../extensions/indexes/hnsw/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }
