[package]
name = "pond_lakehouse_lens"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LakehouseLens — tabular storage with PND2, versioning, and SQL (Rust port)"

[lib]
name = "pond_lakehouse_lens"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
pond_kernel = { path = "../../../core/kernel" }
pond_storage = { path = "../../../core/storage" }
pond_core = { path = "../../../core/codec", features = ["zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }
