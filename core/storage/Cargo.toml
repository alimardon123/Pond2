[package]
name = "pond_storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pond UnifiedStorage — manifest management, CRDT shards, commits, branch/merge, read/write paths"

[lib]
name = "pond_storage"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
# `async` is OPT-IN. When enabled, exposes async read helpers
# (`read::read_rows_async`) that call `PondKernel::read_blob_async`.
# Forwards to `pond_kernel/async` so the kernel's async API is available
# alongside this crate's async helpers.
async = ["pond_kernel/async"]

[dependencies]
pond_kernel = { path = "../kernel" }
pond_core = { path = "../codec", features = ["zstd"] }
serde_json = "1"
sha2 = "0.10"
zstd = "0.13"

[dev-dependencies]
tempfile = { workspace = true }
serde_json = "1"
# For async tests in the storage crate (when the `async` feature is on).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench_storage"
harness = false
