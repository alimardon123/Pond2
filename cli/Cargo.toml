[package]
name = "pond_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pond CLI — the 'pond' command. Single binary, DuckDB philosophy."

[[bin]]
name = "pond"
path = "src/main.rs"

[features]
default = ["s3", "cache"]
# S3 support (enabled by default). Disable with --no-default-features to
# build a local-only CLI without the pond_s3 dependency.
s3 = ["dep:pond_s3"]
# Local disk+memory cache tier for S3 reads (enabled by default).
# Warm reads are served in µs–ms instead of 50–300ms S3 RTTs.
cache = ["dep:pond_cache"]

[dependencies]
pond_kernel = { path = "../core/kernel" }
pond_storage = { path = "../core/storage" }
pond_core = { path = "../core/codec", features = ["zstd"] }
pond_sql = { path = "../core/sql" }
pond_s3 = { path = "../core/s3", optional = true }
pond_cache = { path = "../core/cache", optional = true }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }
serde_json = "1"
