[package]
name = "pond_ivf_index"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vector ANN index (IVF) — fixes Bug 10 with per-cluster blob references"

[lib]
name = "pond_ivf_index"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
pond_kernel = { path = "../../../../core/kernel" }
pond_storage = { path = "../../../../core/storage" }
pond_core = { path = "../../../../core/codec", features = ["zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }
