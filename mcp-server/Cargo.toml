[package]
name = "pond_mcp_server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pond-mcp-server"
path = "src/main.rs"

[dependencies]
pond_storage = { path = "../core/storage" }
pond_kernel = { path = "../core/kernel" }
pond_core = { path = "../core/codec", features = ["zstd"] }
pond_sql = { path = "../core/sql" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = { workspace = true }
